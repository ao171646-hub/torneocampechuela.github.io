<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <style>
    body { background:#0b1220; color:white; font-family:Arial; padding:2rem; }
    input, button, textarea { padding:0.5rem; margin:0.5rem 0; width:100%; }
    #panel { display:none; }
  </style>
</head>
<body>

<h2>Acceso privado</h2>
<input type="password" id="pass" placeholder="Contraseña">
<button onclick="login()">Entrar</button>

<div id="panel">
  <h2>Editar datos del torneo</h2>
  <textarea id="json" rows="20"></textarea>
  <button onclick="descargar()">Descargar archivo data.json</button>
</div>

<script>
const PASSWORD = "campechuela2026"; // cámbiala

function login() {
  const p = document.getElementById("pass").value;
  if (p === PASSWORD) {
    document.getElementById("panel").style.display = "block";
    cargarJSON();
  } else {
    alert("Contraseña incorrecta");
  }
}

function cargarJSON() {
  fetch("data.json")
    .then(r => r.json())
    .then(data => {
      document.getElementById("json").value = JSON.stringify(data, null, 2);
    });
}

function descargar() {
  const contenido = document.getElementById("json").value;
  const blob = new Blob([contenido], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "data.json";
  a.click();
}
</script>

</body>
</html>
