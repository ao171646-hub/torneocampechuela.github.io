<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Torneo de Fútbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Torneo de Fútbol</h1>
</header>

<main>

  <section>
    <h2>Tabla de posiciones</h2>
    <table>
      <thead>
        <tr>
          <th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th>
          <th>GF</th><th>GC</th><th>DG</th><th>Puntos</th>
        </tr>
      </thead>
      <tbody id="tabla-posiciones"></tbody>
    </table>
  </section>

  <section>
    <h2>Calendario</h2>
    <div id="lista-partidos"></div>
  </section>

  <section>
    <h2>Goleadores</h2>
    <table>
      <thead>
        <tr><th>Jugador</th><th>Equipo</th><th>Goles</th></tr>
      </thead>
      <tbody id="tabla-goleadores"></tbody>
    </table>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
